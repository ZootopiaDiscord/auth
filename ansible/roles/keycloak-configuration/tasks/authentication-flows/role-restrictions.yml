---
# Second half of the role restrictions; the first half is the matching pair of
# conditional sub-flows at the end of the realm browser flow, in browser.yml.
- name: Configure role restriction post login flow
  community.general.keycloak_authentication_v2:
    auth_keycloak_url: "{{ keycloak_url }}"
    auth_realm: master
    auth_client_id: "{{ keycloak_ansible_client_id }}"
    auth_client_secret: "{{ vault_keycloak_ansible_client_secret }}"
    validate_certs: "{{ validate_certs | default(true) }}"

    realm: "{{ keycloak_realm_name }}"
    alias: "{{ role_restriction_post_login_flow }}"
    description: "Runs after a Discord login, denies clients carrying a role restriction scope to users without that role"
    state: present
    authenticationExecutions:
      - subFlow: "{{ role_restriction_post_login_flow }} - zootopian police"
        requirement: "CONDITIONAL"
        authenticationExecutions:
          - providerId: "conditional-client-scope"
            requirement: "REQUIRED"
            authenticationConfig:
              alias: "post login - client is zootopian police only"
              config:
                client_scope: "{{ client_scope_zpd }}"
                negate: "false"

          - providerId: "conditional-user-role"
            requirement: "REQUIRED"
            authenticationConfig:
              alias: "post login - not zootopian police"
              config:
                condUserRole: "{{ realm_role_zpd }}"
                negate: "true"

          - providerId: "deny-access-authenticator"
            requirement: "REQUIRED"
            authenticationConfig:
              alias: "post login - deny non zootopian police"
              config:
                denyErrorMessage: "Only members of the {{ realm_role_zpd }} can sign in to this application."

      - subFlow: "{{ role_restriction_post_login_flow }} - mod"
        requirement: "CONDITIONAL"
        authenticationExecutions:
          - providerId: "conditional-client-scope"
            requirement: "REQUIRED"
            authenticationConfig:
              alias: "post login - client is mod only"
              config:
                client_scope: "{{ client_scope_mod }}"
                negate: "false"

          - providerId: "conditional-user-role"
            requirement: "REQUIRED"
            authenticationConfig:
              alias: "post login - not mod"
              config:
                condUserRole: "{{ realm_role_mod }}"
                negate: "true"

          - providerId: "deny-access-authenticator"
            requirement: "REQUIRED"
            authenticationConfig:
              alias: "post login - deny non mod"
              config:
                denyErrorMessage: "Only members of {{ realm_role_mod }} can sign in to this application."

      - providerId: "allow-access-authenticator"
        requirement: "REQUIRED"
