all:
  children:
    sunset:
      hosts:
        sunset-host-1:
          ansible_connection: local
          validate_certs: false
          keycloak_url: https://auth.zoot.local
          vault_overlay: local

          local_clients:
            - client_id: aio-local
              name: Zootopia AIO (local)
              authorization_code_flow: true
              consent_required: false
              redirect_uris:
                - https://app.zoot.local/signin-oidc
                - https://localhost:7253/signin-oidc
              post_logout_redirect_uris:
                - https://app.zoot.local/signout-callback-oidc
                - https://localhost:7253/signout-callback-oidc
              jwks_url: https://zoot.local/.well-known/jwks
              backchannel_logout_url: https://zoot.local/signout-backchannel-oidc
              optional_client_scopes:
                - profile
                - roles
