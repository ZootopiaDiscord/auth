name: Build Keycloak

on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"
    paths:
      - 'Dockerfile'
      - 'extensions/**'
      - '.github/workflows/build-keycloak.yml'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 21
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: temurin
        java-version: '21'
        cache: maven

    - name: Run extension tests
      run: mvn -B test
      working-directory: extensions

  build:
    needs: test
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Extract Docker metadata
      id: metadata
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
        tags: |
          # full version, e.g. 26.7.2.0 (keycloak version + our build number)
          type=match,pattern=v(\d+\.\d+\.\d+\.\d+),group=1
          # keycloak version, e.g. 26.7.2 (floats to the latest build)
          type=match,pattern=v(\d+\.\d+\.\d+),group=1
          # keycloak major.minor, e.g. 26.7
          type=match,pattern=v(\d+\.\d+),group=1
          # keycloak major, e.g. 26
          type=match,pattern=v(\d+),group=1
          type=ref,event=branch
          type=sha,format=short
        flavor: |
          latest=${{ github.ref_type == 'tag' }}

    - name: Set up QEMU (for multi-arch)
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push multi-arch image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64,linux/arm64
        provenance: false
        push: true
        tags: ${{ steps.metadata.outputs.tags }}
        labels: ${{ steps.metadata.outputs.labels }}

    - name: Compute release name (from tag)
      id: release_meta
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ steps.release_meta.outputs.version }}
        draft: false
        prerelease: false
